<svg width="320" height="100" viewBox="0 0 320 100" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Icon mark: dark square with triangle/mould shape -->
  <rect width="80" height="80" x="10" y="10" rx="8" fill="#1a2332"/>

  <!-- Triangle = solidification cone / mould schematic -->
  <polygon points="50,22 22,68 78,68" fill="none" stroke="#c8702a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Horizontal line = soft reduction zone -->
  <line x1="31" y1="55" x2="69" y2="55" stroke="#c8702a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Apex dot = meniscus / liquid steel point -->
  <circle cx="50" cy="22" r="4" fill="#c8702a"/>

  <!-- Wordmark -->
  <text x="108" y="52" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="700" fill="#1a2332" letter-spacing="-1">m4</text>
  <text x="146" y="52" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="700" fill="#c8702a" letter-spacing="-1">metallurgy</text>

  <!-- Tagline -->
  <text x="109" y="70" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7a8d" letter-spacing="2">RESEARCH · EDUCATION · STEEL</text>

</svg>
